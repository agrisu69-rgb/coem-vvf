const MEDIA={},BLOBS={};let idb=null;

function idbClear(){try{idb&&idb.transaction('m','readwrite').objectStore('m').clear()}catch(e){}}
function mediaPut(blob){const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);BLOBS[id]=blob;MEDIA[id]=URL.createObjectURL(blob);try{idb&&idb.transaction('m','readwrite').objectStore('m').put(blob,id)}catch(e){}return id}

function compress(file){return new Promise(res=>{if(!file.type||!file.type.startsWith('image/')||file.type==='image/gif')return res(file);const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1920,r=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.85)};img.onerror=()=>res(file);img.src=u})}
async function addFiles(files){const out=[];for(const f of files){const v=(f.type||'').startsWith('video');const b=v?f:await compress(f);out.push({id:mediaPut(b),type:v?'video':'img',name:(f.name||'file').replace(/\.[^.]+$/,'')+(v?'':'.jpg'),by:ME().cognome,t:Date.now(),pub:true})}return out}

    for(const [s,ty] of c){const e=new Date(s.getTime()+12*36e5);if(now>=s&&now<e)return{now:true,ty,e};if(s>now)return{s,ty}}}

function nextSalto(T,g){if(!DI.includes(T)||!g)return null;const n=new Date();for(let k=0;k<40;k++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+k);if(st(d,T,g)==='X'&&DI[idx(d)]===T)return d}return null}
const ferieSp=(u,y)=>((DB.ferie[u]||{})[y])||{d:cfg().ferieD,n:cfg().ferieN};
function ferieUso(u,y){const m=U(u),a=DB.ann[u]||{};let d=0,n=0;for(const k in a){if(a[k].type!=='Ferie'||!k.startsWith(y+'-'))continue;const s=st(parse(k),m.turno,m.salto);if(s==='G')d++;else if(s==='N')n++}return{d,n}}
function inServizio(){
  const now=new Date(),h=now.getHours(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());let T,dS,ty;
  if(h>=oD()&&h<oN()){T=DI[idx(today)];dS=today;ty='diurno'}else if(h>=oN()){T=NO[idx(today)];dS=today;ty='notturno'}else{dS=new Date(today);dS.setDate(dS.getDate()-1);T=NO[idx(dS)];ty='notturno'}
  const g=salGrp(cyc(dS,T)),key=ymd(dS),per=DB.users.filter(u=>u.stato==='Attivo'&&u.turno===T);
  const rows=cfg().sedi.map(s=>{const l=per.filter(u=>u.sede===s);return{s,pres:l.filter(u=>+u.salto!==g&&!isAss(u.u,key)),sal:l.filter(u=>+u.salto===g),ass:l.filter(u=>+u.salto!==g&&isAss(u.u,key))}});

function edSave(mode){

  const r=ED.rep?DB.reports.find(z=>z.id===ED.rep):null,e=ED.ev?DB.evs.find(z=>z.id===ED.ev):null;
  c={id:++DB.seq.com,num:0,anno:null,titolo:t,testo:x,media,repId:r?r.id:null,evId:e?e.id:null,stato:'Bozza',creato:{t:Date.now(),by:me.cognome},approvato:null,nota:'',mod:[],invii:[],

function impCsv(inp){const f=inp.files[0];inp.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{let n=0;String(rd.result).replace(/^﻿/,'').split(/\r?\n/).forEach(line=>{const c=line.split(/[;,](?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"').trim());if(c.length<3||!/@/.test(c[2]))return;if(DB.press.some(p=>p.email.toLowerCase()===c[2].toLowerCase()))return;const ls=(c[3]||'').split('|').map(x=>x.trim()).filter(Boolean);ls.forEach(l=>{if(!DB.liste.includes(l))DB.liste.push(l)});DB.press.push({id:++DB.seq.press,nome:c[0]||'Redazione',testata:c[1]||c[2],email:c[2],tel:'',liste:ls,attivo:true});n++});save();render();toast(`${n} contatti importati`)};rd.readAsText(f)}

function resetDemo(){showSheet(`<h2>Ripristinare i dati dimostrativi?</h2><p>Tutto quello che hai inserito su questo dispositivo (segnalazioni, comunicati, eventi, foto, annotazioni) verrà cancellato.</p><button class="btn" onclick="idbClear();DB=seed();save();closeO();logout();toast('Dati ripristinati')">Ripristina</button><button class="btn gray" onclick="closeO()">Annulla</button>`)}
function userList(){const f=S.uf,q=f.q.trim().toLowerCase();
  const l=DB.users.filter(u=>(!f.sede||u.sede===f.sede)&&(!f.turno||u.turno===f.turno)&&(!f.stato||u.stato===f.stato)&&(!q||(u.cognome+' '+u.nome+' '+u.matricola+' '+u.u).toLowerCase().includes(q))).sort((a,b)=>((b.stato==='In attesa')-(a.stato==='In attesa'))||a.cognome.localeCompare(b.cognome));
  return `<p class="muted" style="margin:0 0 8px">${l.length} utenti</p><div class="card">`+l.map(u=>`<div class="li" style="align-items:flex-start;flex-direction:column;gap:6px">
  <div class="row" style="width:100%"><b>${esc(u.cognome.toUpperCase())} ${esc(u.nome)}</b><span class="sp"></span>${u.stato==='In attesa'?'<span class="badge b-attesa">In attesa</span>':badge(u.stato)}${u.ruolo!=='utente'?` <span class="badge b-In">${u.ruolo==='comandante'?'Comandante':'Admin'}</span>`:''}</div>
  <div class="muted">${esc(u.qual)} · Matr. ${esc(u.matricola)} · ${esc(sedeS(u.sede))} · ${u.turno==='Giornaliero'?'Giornaliero':'Turno '+esc(u.turno)+(u.salto?'/'+u.salto:'')}</div>
  ${u.u===S.me?'':`<div class="row">${u.stato==='In attesa'?`<button class="btn sm green" onclick="setU('${u.u}','Attivo')">✓ Approva</button><button class="btn sm gray" onclick="rifiuta('${u.u}')">Rifiuta</button>`:u.stato==='Attivo'?`<button class="btn sm gray" onclick="setU('${u.u}','Bloccato')">Blocca</button>`:`<button class="btn sm gray" onclick="setU('${u.u}','Attivo')">Sblocca</button>`}<button class="btn sm gray" onclick="uEdit('${u.u}')">✏️ Modifica</button></div>`}</div>`).join('')+'</div>'}
function vUsers(){const f=S.uf,ref="$('ulist').innerHTML=userList()";
  return `<h2>Utenti</h2><div class="card"><input placeholder="🔍 Cerca nome o matricola…" value="${esc(f.q)}" oninput="S.uf.q=this.value;${ref}">
  <div class="row" style="margin-top:8px"><select onchange="S.uf.sede=this.value;${ref}"><option value="">Tutte le sedi</option>${cfg().sedi.map(s=>`<option value="${esc(s)}" ${s===f.sede?'selected':''}>${esc(sedeC(s))}</option>`).join('')}</select><select onchange="S.uf.turno=this.value;${ref}"><option value="">Tutti i turni</option>${TURNI.map(t=>`<option ${t===f.turno?'selected':''}>${t}</option>`).join('')}</select></div>
  <select style="margin-top:8px" onchange="S.uf.stato=this.value;${ref}"><option value="">Tutti gli stati</option>${['In attesa','Attivo','Bloccato'].map(s=>`<option ${s===f.stato?'selected':''}>${s}</option>`).join('')}</select></div><div id="ulist">${userList()}</div>`}
function setU(x,s){const u=U(x);u.stato=s;if(s==='Attivo')notify(x,'✅ Il tuo account Co.Em. è stato approvato. Benvenuto!',null);save();render();toast(s==='Attivo'?'Utente attivo: riceve una notifica':'Utente bloccato')}
function rifiuta(x){DB.users.splice(DB.users.indexOf(U(x)),1);save();render();toast('Richiesta rifiutata')}
function uEdit(x){const u=U(x);showSheet(`<h2>${esc(u.cognome.toUpperCase())} ${esc(u.nome)}</h2><label>Matricola</label><input id="ue_m" value="${esc(u.matricola)}"><label>Qualifica</label><select id="ue_q">${opts(cfg().qual,u.qual)}</select><label>Sede</label><select id="ue_s">${opts(cfg().sedi,u.sede)}</select><label>Turno</label><select id="ue_t">${opts(TURNI,u.turno)}</select><label>Gruppo salto</label><select id="ue_g"><option value="">Nessuno</option>${SALTI.map(n=>`<option value="${n}" ${n===u.salto?'selected':''}>${n}</option>`).join('')}</select>
  <label>Ruolo nell'app</label><select id="ue_r">${Object.entries(RUOLI).map(([k,v])=>`<option value="${k}" ${k===u.ruolo?'selected':''}>${v}</option>`).join('')}</select><p class="muted">Il Comandante approva i comunicati prima dell'invio alla stampa.</p>
  <button class="btn" onclick="uSave('${x}')">Salva</button><button class="btn sec" onclick="closeO();rifiuta('${x}')">Elimina account</button><button class="btn gray" onclick="closeO()">Annulla</button>`)}
function uSave(x){const u=U(x),n={matricola:$('ue_m').value.trim().toUpperCase(),qual:$('ue_q').value,sede:$('ue_s').value,turno:$('ue_t').value,salto:+$('ue_g').value||null,ruolo:$('ue_r').value};if(n.ruolo!==u.ruolo)notify(x,`🔐 Il tuo ruolo nell'app ora è: ${RUOLI[n.ruolo]}`,null);
  [['sede','Sede'],['turno','Turno'],['qual','Qualifica'],['ruolo','Ruolo']].forEach(([k,l])=>{if(u[k]!==n[k])u.storico.push({t:Date.now(),text:`${l}: ${u[k]} → ${n[k]} (da ${ME().cognome})`})});Object.assign(u,n);save();closeO();render();toast('Utente aggiornato')}
function vNotif(){const l=myNotifs().slice().reverse();
  return `<div class="row"><h2 class="sp">Notifiche</h2>${l.some(n=>!n.read)?'<button class="btn sm gray" onclick="myNotifs().forEach(n=>n.read=true);save();render()">Segna tutte lette</button>':''}</div>`+(l.length?`<div class="card">${l.map(n=>`<div class="li rep" onclick="openNotif(${n.id})" style="align-items:flex-start;${n.read?'opacity:.6':''}">${n.read?'':'<span style="width:9px;height:9px;border-radius:50%;background:#e53935;flex:none;margin-top:5px"></span>'}<div class="sp"><div style="${n.read?'':'font-weight:700'}">${esc(n.text)}</div><div class="muted">${rel(n.t)}</div></div></div>`).join('')}</div>`:'<div class="card muted">Nessuna notifica.</div>')}
function vImpost(){
  const c=cfg(),box=(k,t)=>`<div class="card"><h3>${t}</h3>${c[k].map((x,i)=>`<div class="li"><span class="sp">${esc(x)}</span><button class="x" onclick="rmItem('${k}',${i})">✕</button></div>`).join('')}<div class="row" style="margin-top:8px"><input id="add_${k}" placeholder="Aggiungi…"><button class="btn sm" onclick="addItem('${k}')">+</button></div></div>`;
  const [pm,pd]=(c.patrono||'01-20').split('-');
  return `<h2>Impostazioni</h2>
  <div class="card"><h3>Turni e salti</h3><label style="margin-top:0">Giorno in cui il turno A fa il diurno</label><input type="date" value="${c.refDate}" onchange="if(this.value){cfg().refDate=this.value;save();toast('Turnario ricalcolato per tutti')}">
  <label>In quel ciclo è in salto il gruppo</label><select onchange="cfg().salRef=+this.value;save();toast('Salti ricalcolati')">${SALTI.map(n=>`<option ${n===c.salRef?'selected':''}>${n}</option>`).join('')}</select>
  <label>Inizio turno diurno</label><select onchange="cfg().oD=+this.value;save();toast('Orari aggiornati')">${[6,7,8,9].map(h=>`<option value="${h}" ${h===c.oD?'selected':''}>${pad(h)}:00 (notturno dalle ${pad(h+12)}:00)</option>`).join('')}</select>
  <p class="muted" style="margin-bottom:0">Tarato sull'app Turnario VVF: 04/11/2026 diurno A3, notturno D2.</p></div>
  <div class="card"><h3>Festa patronale</h3><div class="row"><select id="pp_d">${Array.from({length:31},(_,i)=>`<option ${i+1===+pd?'selected':''}>${pad(i+1)}</option>`).join('')}</select><select id="pp_m">${MESIL.map((m,i)=>`<option value="${pad(i+1)}" ${i+1===+pm?'selected':''}>${m}</option>`).join('')}</select></div><input id="pp_n" style="margin-top:8px" value="${esc(c.patronoNome)}" placeholder="Nome del santo"><button class="btn sm" style="margin-top:8px" onclick="cfg().patrono=$('pp_m').value+'-'+$('pp_d').value;cfg().patronoNome=$('pp_n').value.trim();save();toast('Festa patronale salvata')">Salva</button></div>
  <div class="card"><h3>Ferie spettanti di default</h3><div class="row"><input type="number" min="0" value="${c.ferieD}" onchange="cfg().ferieD=+this.value;save()"><input type="number" min="0" value="${c.ferieN}" onchange="cfg().ferieN=+this.value;save()"></div><div class="muted" style="margin-top:4px">Turni diurni · notturni all'anno (ognuno può cambiarli nel profilo)</div></div>
  <div class="card"><h3>Comunicati ed eventi</h3><div class="checks"><label><input type="checkbox" ${c.approvazione?'checked':''} onchange="cfg().approvazione=this.checked;save();toast('Salvato')"> Il Comandante deve approvare i comunicati prima dell'invio</label><label><input type="checkbox" ${c.vigiliEventi?'checked':''} onchange="cfg().vigiliEventi=this.checked;save();toast('Salvato')"> I vigili vedono gli eventi e possono caricare foto e video</label></div></div>
  ${box('sedi','Sedi')}${box('qual','Qualifiche')}${box('tipi','Tipologie di intervento')}${box('evt','Tipi di evento')}
  <p class="muted">Per rinominare una voce in uso conviene aggiungerne una nuova: le segnalazioni già inviate conservano il nome originale.</p>`;
}
function addItem(k){const v=$('add_'+k).value.trim();if(!v)return;cfg()[k].push(v);save();render();toast('Aggiunto')}
function rmItem(k,i){const v=cfg()[k][i];if(k==='sedi'&&DB.users.some(u=>u.sede===v))return toast('Sede in uso da alcuni utenti: spostali prima');cfg()[k].splice(i,1);save();render();toast('Rimosso')}

const VIEWS={turni:vTurni,segnala:vSegnala,mie:vMie,eventi:vEventi,altro:vAltro,adm:vAdm,com:vCom};
const DET={rep:vRep,com:vComD,ev:vEv,notif:vNotif,users:vUsers,impost:vImpost,prof:vProf};

/* =================== app installabile (PWA) =================== */
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}

/* =================== avvio =================== */
DB=load();
render();
(async()=>{const t0=Date.now();idb=await idbOpen();await idbAll();await new Promise(r=>setTimeout(r,Math.max(0,900-(Date.now()-t0))));S.splash=false;const u=sess&&U(sess);if(u&&u.stato==='Attivo')setMe(u);else render()})();
</script>
</body>
</html>
